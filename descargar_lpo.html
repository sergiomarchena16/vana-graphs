<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vana - Descargar LPO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            background-color: #F6F8FB;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        
        button {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            letter-spacing: 0.3px;
            background-color: #4f7bff;
            color: white;
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 12px rgba(79, 123, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        
        button:hover:not(:disabled) {
            background-color: #3d5fd6;
            color: white;
            box-shadow: 0 6px 20px rgba(79, 123, 255, 0.4);
            transform: translateY(-3px);
        }
        
        button:active:not(:disabled) {
            transform: translateY(-1px);
            color: white;
        }
        
        button:disabled {
            background-color: #4f7bff;
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .status-message {
            font-size: 12px;
            color: #666;
            text-align: center;
            min-height: 20px;
        }
        
        .status-message.success {
            color: #22c55e;
        }
        
        .status-message.error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="download-btn" onclick="handleClick()">
            <span id="button-text">Descargar LPO</span>
        </button>
        <div id="status-message" class="status-message"></div>
    </div>

    <script>
        const MAGE_WEBHOOK_URL = "https://cluster.mage.ai/mageai-9480-development/api/pipeline_schedules/262/pipeline_runs/88e8bee3ff24488cb80734cf6f269fb4";
        
        let isLoading = false;
        
        async function handleClick() {
                if (isLoading) return;
                
                const btn = document.getElementById('download-btn');
                const btnText = document.getElementById('button-text');
                const statusMsg = document.getElementById('status-message');
                
                isLoading = true;
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span>Procesando...';
                statusMsg.textContent = 'Esto puede tardar 3-4 minutos. No cierres esta página.';
                
                try {
                    const payload = {
                        pipeline_run: {
                            variables: {}
                        }
                    };
                    
                    const controller = new AbortController();
                    // Timeout de 5 minutos (300000ms)
                    const timeoutId = setTimeout(() => controller.abort(), 300000);
                    
                    const response = await fetch(MAGE_WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const result = await response.json();
                    
                    if (!result.files || Object.keys(result.files).length === 0) {
                        throw new Error('No files returned from server');
                    }
                    
                    // Descargar cada archivo
                    let downloadCount = 0;
                    for (const [filename, base64Data] of Object.entries(result.files)) {
                        try {
                            downloadFile(filename, base64Data);
                            downloadCount++;
                        } catch (err) {
                            console.error(`Error downloading ${filename}:`, err);
                        }
                    }
                    
                    // Mostrar éxito
                    btnText.textContent = '¡Descargados!';
                    statusMsg.textContent = `✓ ${downloadCount} archivo(s) descargado(s) correctamente`;
                    statusMsg.classList.add('success');
                    
                    setTimeout(() => {
                        isLoading = false;
                        btn.disabled = false;
                        btnText.textContent = 'Descargar LPO';
                        statusMsg.textContent = '';
                        statusMsg.classList.remove('success', 'error');
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error:', error);
                    
                    let errorMsg = 'Intenta de nuevo';
                    if (error.name === 'AbortError') {
                        errorMsg = 'Timeout: la solicitud tardó demasiado';
                    } else if (error.message) {
                        errorMsg = error.message;
                    }
                    
                    btnText.textContent = 'Error al descargar';
                    statusMsg.textContent = errorMsg;
                    statusMsg.classList.add('error');
                    
                    setTimeout(() => {
                        isLoading = false;
                        btn.disabled = false;
                        btnText.textContent = 'Descargar LPO';
                        statusMsg.textContent = '';
                        statusMsg.classList.remove('success', 'error');
                    }, 3000);
                }
            }
        
        function downloadFile(filename, base64Data) {
            // Decodificar base64 a binary
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            // Crear blob y descargar
            const blob = new Blob([bytes], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
