<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vana - Enviar Tipos de Cambio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            background-color: #F6F8FB;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        
        button {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            letter-spacing: 0.3px;
            background-color: #4f7bff;
            color: white;
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 12px rgba(79, 123, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        
        button:hover:not(:disabled) {
            background-color: #3d5fd6;
            color: white;
            box-shadow: 0 6px 20px rgba(79, 123, 255, 0.4);
            transform: translateY(-3px);
        }
        
        button:active:not(:disabled) {
            transform: translateY(-1px);
            color: white;
        }
        
        button:disabled {
            background-color: #4f7bff;
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        /* Spinner animado */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="download-btn" onclick="handleClick()">
            <span id="button-text">Enviar Tipos de Cambio</span>
        </button>
    </div>

    <script>
        const MAGE_WEBHOOK_URL = "https://cluster.mage.ai/mageai-9480-development/api/pipeline_schedules/271/pipeline_runs/d506d1f4ee224a998e6b593cbbadd5e9"
        let isLoading = false;
        
        async function handleClick() {
            if (isLoading) return;
            
            const btn = document.getElementById('download-btn');
            const btnText = document.getElementById('button-text');
            
            isLoading = true;
            btn.disabled = true;
            
            // Mostrar estado de carga
            btnText.innerHTML = '<span class="spinner"></span>Enviando';
            
            try {
                const payload = {
                    pipeline_run: {
                        variables: {}
                    }
                };
                
                const response = await fetch(MAGE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                    timeout: 10000
                });
                
                // Aquí puedes manejar la respuesta si lo necesitas
                console.log('Response:', response);
                
                // Mostrar éxito temporalmente (opcional)
                btnText.textContent = '¡Enviado!';
                
                // Volver al estado normal después de 2 segundos
                setTimeout(() => {
                    isLoading = false;
                    btn.disabled = false;
                    btnText.textContent = 'Enviar Tipos de Cambio';
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                
                // Mostrar error temporalmente
                btnText.textContent = 'Error al enviar';
                
                // Volver al estado normal después de 2 segundos
                setTimeout(() => {
                    isLoading = false;
                    btn.disabled = false;
                    btnText.textContent = 'Enviar Tipos de Cambio;
                }, 2000);
            }
        }
    </script>
</body>
</html>
